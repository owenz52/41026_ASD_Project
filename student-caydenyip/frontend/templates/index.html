<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>Exams - Student Portal</title>

    <link
        rel="stylesheet"
        href="./css/styles.css"
    >


</head>


<body>


<div class="layout">


    <!-- =========================================================
         SIDEBAR
    ========================================================== -->

    <aside class="sidebar">

        <a
            class="brand"
            href="/home.html"
        >

            <span class="brand__mark"></span>

            <div>

                <div class="brand__name">
                    STUDENT PORTAL
                </div>

                <div class="brand__sub">
                    41026 ASD
                </div>

            </div>

        </a>


        <nav class="nav">

            <a
                class="nav__item"
                href="/home.html"
            >
                HOME
            </a>

            <a
                class="nav__item"
                href="/enrolment/"
            >
                ENROLMENT
            </a>

            <a
                class="nav__item"
                href="/assessments/"
            >
                ASSESSMENTS
            </a>

            <a
                class="nav__item"
                href="/calendar/"
            >
                CALENDAR
            </a>

            <a
                class="nav__item"
                href="/notes/"
            >
                NOTES
            </a>

            <a
                class="nav__item nav__item--active"
                href="/exams/"
            >
                EXAMS
            </a>

        </nav>

    </aside>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main class="main">


        <header class="header">

            <div>

                <h1 class="header__title">
                    Exams
                </h1>

            </div>

        </header>


        <!-- =====================================================
             MY EXAMS
        ====================================================== -->

        <section class="exam-section">


            <div class="exam-section__body">


                <div class="exams-header">

                    <div class="exams-header__left">

                        <h2>
                            My Exams
                        </h2>

                        <button
                            id="reset-exams-btn"
                            class="btn"
                            type="button"
                        >
                            Reset My Exams
                        </button>

                    </div>


                    <button
                        id="open-add-exam-btn"
                        class="btn btn--primary"
                        type="button"
                    >
                        + Add Exam
                    </button>

                </div>


                <div
                    id="exams-result"
                >

                    <div class="exam-message">
                        Loading exams...
                    </div>

                </div>


            </div>

        </section>


        <!-- =====================================================
             FIND EXAMS BY COURSE
        ====================================================== -->

        <section class="exam-section">


            <div class="exam-section__body">

                <div class="exams-header">

                    <h2>
                        Find Exams by Course ID
                    </h2>

                </div>


                <form
                    id="exams-by-course-form"
                    class="search-form"
                >

                    <input
                        id="course_id"
                        name="course_id"
                        type="text"
                        placeholder="Course ID"
                        required
                    >

                    <button
                        class="btn btn--primary"
                        type="submit"
                    >
                        Find Exams
                    </button>

                </form>


                <div
                    id="course-result"
                    style="margin-top: 14px;"
                ></div>


            </div>

        </section>


        <!-- =====================================================
             ASK LOCAL AI AGENT
        ====================================================== -->

        <section id ="ai-agent" class="exam-section">


            <div class="exam-section__body">

                <h2 style="margin-bottom: 14px;">
                    Ask Local AI Agent
                </h2>


                <form
                    id="ask-with-context-form"
                    class="form"
                >

                    <div class="field">

                        <span>
                            Ask the agent about your current exams
                        </span>

                        <textarea
                            id="context-question"
                            name="question"
                            rows="4"
                            placeholder="Ask something about your exams..."
                            required
                        ></textarea>

                    </div>


                    <div>

                        <button
                            class="btn btn--primary"
                            type="submit"
                        >
                            Ask With Context
                        </button>

                    </div>

                </form>


                <div
                    id="context-result"
                    class="panel"
                    style="margin-top: 14px;"
                ></div>


            </div>

        </section>


    </main>

</div>


<!-- =============================================================
     ADD EXAM MODAL
============================================================== -->

<div
    id="add-exam-modal"
    class="modal"
    hidden
>

    <div
        class="modal__box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-exam-title"
    >

        <h2
            id="add-exam-title"
            class="modal__title"
        >
            Add Exam
        </h2>


        <form
            id="add-exam-form"
            class="form"
        >


            <div class="field">

                <span>
                    Course ID
                </span>

                <input
                    id="add-course-id"
                    name="course_id"
                    type="text"
                    placeholder="Example: 101"
                    required
                >

            </div>


            <div class="field">

                <span>
                    Exam Name
                </span>

                <input
                    id="add-exam-name"
                    name="exam_name"
                    type="text"
                    placeholder="Example: Mathematics Final"
                    required
                >

            </div>


            <div class="field-row">


                <div class="field">

                    <span>
                        Exam Date
                    </span>

                    <input
                        id="add-exam-date"
                        name="exam_date"
                        type="date"
                        required
                    >

                </div>


                <div class="field">

                    <span>
                        Exam Time
                    </span>

                    <input
                        id="add-exam-time"
                        name="exam_time"
                        type="time"
                        required
                    >

                </div>


            </div>


            <div
                id="add-exam-result"
                class="exam-message"
                hidden
            ></div>


            <div class="form__actions">

                <button
                    id="close-add-exam-btn"
                    class="btn"
                    type="button"
                >
                    Cancel
                </button>


                <button
                    class="btn btn--primary"
                    type="submit"
                >
                    Add Exam
                </button>

            </div>


        </form>

    </div>

</div>


<!-- =============================================================
     TOAST
============================================================== -->

<div
    id="toast"
    class="toast"
></div>


<script>


/* =============================================================
   API
============================================================= */

const API_URL = "/exams-api";


/* =============================================================
   READ CURRENT USER
============================================================= */

function readUser() {

    try {

        const raw =
            localStorage.getItem("user");

        return raw
            ? JSON.parse(raw)
            : null;

    } catch (error) {

        console.error(
            "Could not read user:",
            error
        );

        return null;

    }

}


const currentUser = readUser();


const userId =
    currentUser
        ? (
            currentUser.user_id ??
            currentUser.id
        )
        : null;


/* =============================================================
   LOGIN CHECK
============================================================= */

if (
    !currentUser ||
    userId == null
) {

    window.location.href =
        "/login.html";

}


/* =============================================================
   ELEMENTS
============================================================= */

const examsResult =
    document.getElementById(
        "exams-result"
    );

const courseResult =
    document.getElementById(
        "course-result"
    );

const resetExamsButton =
    document.getElementById(
        "reset-exams-btn"
    );

const addExamModal =
    document.getElementById(
        "add-exam-modal"
    );

const openAddExamButton =
    document.getElementById(
        "open-add-exam-btn"
    );

const closeAddExamButton =
    document.getElementById(
        "close-add-exam-btn"
    );

const addExamForm =
    document.getElementById(
        "add-exam-form"
    );

const addExamResult =
    document.getElementById(
        "add-exam-result"
    );

const examsByCourseForm =
    document.getElementById(
        "exams-by-course-form"
    );

const askWithContextForm =
    document.getElementById(
        "ask-with-context-form"
    );

const contextResult =
    document.getElementById(
        "context-result"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =============================================================
   SEARCH STATE
============================================================= */

let currentCourseId = null;


/* =============================================================
   TOAST
============================================================= */

let toastTimer = null;


function showToast(
    message,
    type = "success"
) {

    toast.textContent =
        message;

    toast.className =
        `toast toast--visible toast--${type}`;

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {

                toast.className =
                    "toast";

            },
            2500
        );

}


/* =============================================================
   USER EXAMS URL
============================================================= */

function getUserExamsUrl() {

    return `${API_URL}/exams?student_id=${encodeURIComponent(
        userId
    )}`;

}


/* =============================================================
   SORT EXAMS
============================================================= */

function sortExams(
    exams
) {

    return exams.sort(
        (a, b) => {

            const dateA =
                new Date(
                    `${a.exam_date}T${a.exam_time || "00:00"}`
                );

            const dateB =
                new Date(
                    `${b.exam_date}T${b.exam_time || "00:00"}`
                );

            return dateA - dateB;

        }
    );

}


/* =============================================================
   CREATE EXAM TABLE
============================================================= */

function createExamTable(
    exams,
    showActions = true
) {

    sortExams(exams);


    return `

        <div class="exam-table-scroll">

            <table class="exam-table">

                <thead>

                    <tr>

                        <th>Course ID</th>

                        <th>Exam Name</th>

                        <th>Exam Date</th>

                        <th>Exam Time</th>

                        <th>Status</th>

                        ${
                            showActions
                                ? "<th>Actions</th>"
                                : ""
                        }

                    </tr>

                </thead>


                <tbody>

                    ${exams.map(
                        exam => {

                            const completed =
                                exam.status ===
                                "Completed";


                            const statusClass =
                                completed
                                    ? "status-completed"
                                    : "status-uncompleted";


                            const safeStatus =
                                String(
                                    exam.status ||
                                    "Uncompleted"
                                ).replace(
                                    /'/g,
                                    "\\'"
                                );


                            return `

                                <tr>

                                    <td>
                                        ${exam.course_id}
                                    </td>

                                    <td>
                                        ${exam.exam_name}
                                    </td>

                                    <td>
                                        ${exam.exam_date}
                                    </td>

                                    <td>
                                        ${exam.exam_time || ""}
                                    </td>

                                    <td>

                                        <button
                                            type="button"
                                            class="status-btn ${statusClass}"
                                            onclick="
                                                toggleStatus(
                                                    ${exam.exam_id},
                                                    '${safeStatus}'
                                                )
                                            "
                                        >
                                            ${exam.status}
                                        </button>

                                    </td>


                                    ${
                                        showActions
                                            ? `

                                                <td>

                                                    <div class="actions">

                                                        <button
                                                            type="button"
                                                            class="delete-btn"
                                                            onclick="
                                                                deleteExam(
                                                                    ${exam.exam_id}
                                                                )
                                                            "
                                                        >
                                                            Delete
                                                        </button>

                                                    </div>

                                                </td>

                                            `
                                            : ""
                                    }

                                </tr>

                            `;

                        }
                    ).join("")}

                </tbody>

            </table>

        </div>

    `;

}


/* =============================================================
   GET JSON SAFELY
============================================================= */

async function getResponseData(
    response
) {

    const text =
        await response.text();

    try {

        return text
            ? JSON.parse(text)
            : {};

    } catch {

        return {
            message: text
        };

    }

}


/* =============================================================
   LOAD USER EXAMS
============================================================= */

async function refreshUserExams() {

    examsResult.innerHTML =
        `
        <div class="exam-message">
            Loading exams...
        </div>
        `;


    try {

        const response =
            await fetch(
                getUserExamsUrl()
            );


        const data =
            await getResponseData(
                response
            );


        if (!response.ok) {

            examsResult.innerHTML =
                `
                <div class="exam-message">
                    ${
                        data.error ||
                        "Failed to load exams."
                    }
                </div>
                `;

            return;

        }


        const exams =
            Array.isArray(data)
                ? data
                : [data];


        if (
            exams.length === 0
        ) {

            examsResult.innerHTML =
                `
                <div class="exam-message">
                    No exams found.
                </div>
                `;

            return;

        }


        examsResult.innerHTML =
            createExamTable(
                exams,
                true
            );


    } catch (error) {

        console.error(error);

        examsResult.innerHTML =
            `
            <div class="exam-message">
                Request failed.
            </div>
            `;

    }

}


/* =============================================================
   REFRESH COURSE SEARCH
============================================================= */

async function refreshCourseResults() {

    if (!currentCourseId) {

        return;

    }


    courseResult.innerHTML =
        `
        <div class="exam-message">
            Loading...
        </div>
        `;


    try {

        const response =
            await fetch(
                `${API_URL}/exams/by-course?course_id=${encodeURIComponent(
                    currentCourseId
                )}`
            );


        const data =
            await getResponseData(
                response
            );


        if (!response.ok) {

            courseResult.innerHTML =
                `
                <div class="exam-message">
                    ${
                        data.error ||
                        "No exams found."
                    }
                </div>
                `;

            return;

        }


        const allExams =
            Array.isArray(data)
                ? data
                : [data];


        /*
         * Important:
         * Only show exams belonging to the
         * currently logged-in student.
         */

        const exams =
            allExams.filter(
                exam =>
                    String(
                        exam.student_id
                    ) ===
                    String(userId)
            );


        if (
            exams.length === 0
        ) {

            courseResult.innerHTML =
                `
                <div class="exam-message">
                    No exams found for this course.
                </div>
                `;

            return;

        }


        /*
         * showActions = true means the status
         * button remains active in search results.
         */

        courseResult.innerHTML =
            createExamTable(
                exams,
                false
            );


    } catch (error) {

        console.error(error);

        courseResult.innerHTML =
            `
            <div class="exam-message">
                Request failed.
            </div>
            `;

    }

}


/* =============================================================
   ADD EXAM MODAL
============================================================= */

function openAddExamModal() {

    addExamResult.hidden =
        true;

    addExamResult.textContent =
        "";

    addExamModal.hidden =
        false;


    setTimeout(
        () => {

            document
                .getElementById(
                    "add-course-id"
                )
                .focus();

        },
        50
    );

}


function closeAddExamModal() {

    addExamModal.hidden =
        true;

}


/* =============================================================
   OPEN ADD EXAM
============================================================= */

openAddExamButton.addEventListener(
    "click",
    openAddExamModal
);


/* =============================================================
   CLOSE ADD EXAM
============================================================= */

closeAddExamButton.addEventListener(
    "click",
    closeAddExamModal
);


/* =============================================================
   CLICK OUTSIDE MODAL
============================================================= */

addExamModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            addExamModal
        ) {

            closeAddExamModal();

        }

    }
);


/* =============================================================
   ESC CLOSES MODAL
============================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            !addExamModal.hidden
        ) {

            closeAddExamModal();

        }

    }
);


/* =============================================================
   ADD EXAM
============================================================= */

addExamForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        addExamResult.hidden =
            false;

        addExamResult.textContent =
            "Adding exam...";


        const courseId =
            document
                .getElementById(
                    "add-course-id"
                )
                .value
                .trim();


        const examName =
            document
                .getElementById(
                    "add-exam-name"
                )
                .value
                .trim();


        const examDate =
            document
                .getElementById(
                    "add-exam-date"
                )
                .value;


        const examTime =
            document
                .getElementById(
                    "add-exam-time"
                )
                .value;


        try {

            const response =
                await fetch(
                    `${API_URL}/exams`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                student_id:
                                    userId,

                                course_id:
                                    courseId,

                                exam_name:
                                    examName,

                                exam_date:
                                    examDate,

                                exam_time:
                                    examTime

                            })

                    }
                );


            const data =
                await getResponseData(
                    response
                );


            if (!response.ok) {

                addExamResult.textContent =
                    data.error ||
                    "Failed to add exam.";

                return;

            }


            addExamForm.reset();

            closeAddExamModal();

            showToast(
                data.message ||
                "Exam added successfully.",
                "success"
            );


            await refreshUserExams();


            /*
             * If the user currently has a course
             * search open, update that search too.
             */

            if (currentCourseId) {

                await refreshCourseResults();

            }


        } catch (error) {

            console.error(error);

            addExamResult.textContent =
                "Failed to add exam.";

        }

    }
);


/* =============================================================
   TOGGLE STATUS
============================================================= */

async function toggleStatus(
    examId,
    currentStatus
) {

    const newStatus =
        currentStatus === "Completed"
            ? "Uncompleted"
            : "Completed";


    try {

        const response =
            await fetch(
                `${API_URL}/exams/${encodeURIComponent(
                    examId
                )}`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status: newStatus
                        })

                }
            );


        const data =
            await getResponseData(
                response
            );


        if (!response.ok) {

            showToast(
                data.error ||
                "Failed to update exam status.",
                "error"
            );

            return;

        }


        /*
         * Refresh BOTH tables.
         *
         * This means changing a status from
         * either table keeps the other table
         * up to date.
         */

        await refreshUserExams();


        if (currentCourseId) {

            await refreshCourseResults();

        }


        showToast(
            `Exam marked ${newStatus.toLowerCase()}.`,
            "success"
        );


    } catch (error) {

        console.error(error);

        showToast(
            "Request failed.",
            "error"
        );

    }

}


/* =============================================================
   DELETE EXAM
============================================================= */

async function deleteExam(
    examId
) {

    if (
        !confirm(
            "Are you sure you want to delete this exam?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/exams/${encodeURIComponent(
                    examId
                )}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await getResponseData(
                response
            );


        if (!response.ok) {

            showToast(
                data.error ||
                "Failed to delete exam.",
                "error"
            );

            return;

        }


        showToast(
            "Exam deleted successfully.",
            "success"
        );


        await refreshUserExams();


        if (currentCourseId) {

            await refreshCourseResults();

        }


    } catch (error) {

        console.error(error);

        showToast(
            "Request failed.",
            "error"
        );

    }

}


/* =============================================================
   FIND EXAMS BY COURSE
============================================================= */

examsByCourseForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const courseId =
            document
                .getElementById(
                    "course_id"
                )
                .value
                .trim();


        if (!courseId) {

            return;

        }


        currentCourseId =
            courseId;


        await refreshCourseResults();

    }
);


/* =============================================================
   RESET EXAMS
============================================================= */

resetExamsButton.addEventListener(
    "click",
    async () => {

        if (
            !confirm(
                "This will remove all your existing exams and replace them with fresh exams. Continue?"
            )
        ) {

            return;

        }


        resetExamsButton.disabled =
            true;

        resetExamsButton.textContent =
            "Resetting...";


        try {

            const response =
                await fetch(
                    `${API_URL}/exams/reset?student_id=${encodeURIComponent(
                        userId
                    )}`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        }

                    }
                );


            const data =
                await getResponseData(
                    response
                );


            if (!response.ok) {

                showToast(
                    data.error ||
                    "Failed to reset exams.",
                    "error"
                );

                return;

            }


            showToast(
                data.message ||
                "Exams reset successfully.",
                "success"
            );


            await refreshUserExams();


            if (currentCourseId) {

                await refreshCourseResults();

            }


        } catch (error) {

            console.error(error);

            showToast(
                "Failed to reset exams.",
                "error"
            );

        } finally {

            resetExamsButton.disabled =
                false;

            resetExamsButton.textContent =
                "Reset My Exams";

        }

    }
);


/* =============================================================
   ASK LOCAL AI AGENT
============================================================= */

askWithContextForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const question =
            document
                .getElementById(
                    "context-question"
                )
                .value
                .trim();


        if (!question) {

            contextResult.innerHTML =
                "<p>Please enter a question.</p>";

            return;

        }


        contextResult.innerHTML =
            "<p>Thinking...</p>";


        const formData =
            new URLSearchParams();


        formData.append(
            "question",
            question
        );


        formData.append(
            "student_id",
            userId
        );


        try {

            const response =
                await fetch(
                    `${API_URL}/ask-with-context`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            formData.toString()

                    }
                );


            const body =
                await response.text();


            if (!response.ok) {

                contextResult.innerHTML =
                    `
                    <p>
                        Request failed.
                    </p>

                    <pre>${body}</pre>
                    `;

                return;

            }


            contextResult.innerHTML =
                body;


        } catch (error) {

            console.error(error);

            contextResult.innerHTML =
                `
                <p>
                    Request failed.
                </p>

                <pre>${error}</pre>
                `;

        }

    }
);


/* =============================================================
   INITIAL LOAD
============================================================= */

refreshUserExams();

</script>


</body>

</html>
