<!DOCTYPE html>
<html>
<head>
    <title>Exams - Student Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <span class="brand__mark"></span>
            <div>
                <div class="brand__name">STUDENT PORTAL</div>
                <div class="brand__sub">41026 ASD</div>
            </div>
        </div>

        <nav class="nav">
            <a class="nav__item" href="http://localhost:8080">COURSES</a>
            <a class="nav__item" href="http://localhost:8080">ENROLMENT</a>
            <a class="nav__item" href="http://localhost:8081">NOTES</a>
            <a class="nav__item" href="http://localhost:8082">CALENDAR</a>
            <a class="nav__item nav__item--active" href="http://localhost:8084">EXAMS</a>
            <a class="nav__item" href="/">ASSESSMENTS</a>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="app-shell">

        <header class="app-header">
            <h1>Exams</h1>
            <p>HTMX UI: Normal UI and AI Mode</p>
        </header>

        <section class="tab-shell card">
            <nav class="tab-nav" aria-label="Application tabs">
                <button
                    class="tab-btn is-active"
                    data-tab="normal"
                    type="button">
                    Normal UI
                </button>

                <button
                    class="tab-btn"
                    data-tab="ai-mode"
                    type="button">
                    AI Mode
                </button>
            </nav>

            <div class="tab-content">
                <iframe
                    id="tab-frame-normal"
                    class="tab-frame is-active"
                    src="tabs/normal.html"
                    title="Normal UI tab">
                </iframe>

                <iframe
                    id="tab-frame-ai-mode"
                    class="tab-frame"
                    src="tabs/ai-mode.html"
                    title="AI Mode tab">
                </iframe>
            </div>
        </section>

    </main>

</div>

<script>
const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));

const tabFrames = {
    normal: document.getElementById("tab-frame-normal"),
    "ai-mode": document.getElementById("tab-frame-ai-mode"),
};

function activateTab(tabName) {
    tabButtons.forEach((button) => {
        button.classList.toggle(
            "is-active",
            button.dataset.tab === tabName
        );
    });

    Object.entries(tabFrames).forEach(([name, frame]) => {
        frame.classList.toggle(
            "is-active",
            name === tabName
        );
    });

    window.location.hash = tabName;
}

tabButtons.forEach((button) => {
    if (button.disabled) {
        return;
    }

    button.addEventListener("click", () => {
        activateTab(button.dataset.tab);
    });
});

const hashTab = window.location.hash.replace("#", "");

if (hashTab && tabFrames[hashTab]) {
    activateTab(hashTab);
} else {
    activateTab("normal");
}
</script>

</body>
</html>
