<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Exams — Student Portal</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <a class="brand" href="/home.html">
            <span class="brand__mark"></span>
            <div>
                <div class="brand__name">STUDENT PORTAL</div>
                <div class="brand__sub">41026 ASD</div>
            </div>
        </a>

        <nav class="nav">
            <a class="nav__item" href="/home.html">HOME</a>
            <a class="nav__item" href="/enrolment/">ENROLMENT</a>
            <a class="nav__item" href="/assessments/">ASSESSMENTS</a>
            <a class="nav__item" href="/calendar/">CALENDAR</a>
            <a class="nav__item" href="/notes/">NOTES</a>
            <a class="nav__item nav__item--active" href="/exams/">EXAMS</a>
        </nav>
    </aside>


    <main class="main">

        <header class="header">
            <h1 class="header__title">Exams</h1>
        </header>


        <!-- My Exams -->

        <section class="exam-section">
            <div class="exam-section__body">

                <div class="exams-header">

                    <div class="exams-header__left">
                        <h2>My Exams</h2>

                        <button
                            id="reset-exams-btn"
                            class="btn"
                            type="button"
                        >
                            Reset My Exams
                        </button>
                    </div>

                    <button
                        id="open-add-exam-btn"
                        class="btn btn--primary"
                        type="button"
                    >
                        + Add Exam
                    </button>

                </div>

                <div id="exams-result">
                    <div class="exam-message">
                        Loading exams...
                    </div>
                </div>

            </div>
        </section>


        <!-- Find Exams -->

        <section class="exam-section">
            <div class="exam-section__body">

                <div class="exams-header">
                    <h2>Find Exams by Course ID</h2>
                </div>

                <form id="exams-by-course-form" class="search-form">

                    <input
                        id="course_id"
                        type="text"
                        placeholder="Course ID"
                        required
                    >

                    <button class="btn btn--primary" type="submit">
                        Find Exams
                    </button>

                </form>

                <div
                    id="course-result"
                    style="margin-top:14px;"
                ></div>

            </div>
        </section>


        <!-- AI Agent -->

        <section id="ai-agent" class="exam-section">
            <div class="exam-section__body">

                <h2 style="margin-bottom:14px;">
                    Ask Local AI Agent
                </h2>

                <form id="ask-with-context-form" class="form">

                    <div class="field">

                        <span>
                            Ask the agent about your current exams
                        </span>

                        <textarea
                            id="context-question"
                            rows="4"
                            placeholder="Ask something about your exams..."
                            required
                        ></textarea>

                    </div>

                    <button class="btn btn--primary" type="submit">
                        Ask With Context
                    </button>

                </form>

                <div
                    id="context-result"
                    class="panel"
                    style="margin-top:14px;"
                ></div>

            </div>
        </section>

    </main>
</div>


<!-- Add Exam Modal -->

<div id="add-exam-modal" class="modal" hidden>

    <div
        class="modal__box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-exam-title"
    >

        <h2 id="add-exam-title" class="modal__title">
            Add Exam
        </h2>

        <form id="add-exam-form" class="form">

            <div class="field">
                <span>Course ID</span>

                <input
                    id="add-course-id"
                    type="text"
                    placeholder="Example: 101"
                    required
                >
            </div>

            <div class="field">
                <span>Exam Name</span>

                <input
                    id="add-exam-name"
                    type="text"
                    placeholder="Example: Mathematics Final"
                    required
                >
            </div>

            <div class="field-row">

                <div class="field">
                    <span>Exam Date</span>

                    <input
                        id="add-exam-date"
                        type="date"
                        required
                    >
                </div>

                <div class="field">
                    <span>Exam Time</span>

                    <input
                        id="add-exam-time"
                        type="time"
                        required
                    >
                </div>

            </div>

            <div
                id="add-exam-result"
                class="exam-message"
                hidden
            ></div>

            <div class="form__actions">

                <button
                    id="close-add-exam-btn"
                    class="btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    class="btn btn--primary"
                    type="submit"
                >
                    Add Exam
                </button>

            </div>

        </form>
    </div>
</div>


<div id="toast" class="toast"></div>

<script src="./js/service.js"></script>
<script src="./js/exam-table.js"></script>
<script src="./js/exams.js"></script>
<script src="./js/exam-modal.js"></script>
<script src="./js/exam-search.js"></script>
<script src="./js/exam-actions.js"></script>
<script src="./js/exam-reset.js"></script>
<script src="./js/ai.js"></script>


 
</body>
</html>
