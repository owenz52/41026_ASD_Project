<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>Exams</title>

    <link rel="stylesheet" href="../css/styles.css">

</head>


<body>


<main class="app-shell">

    <section class="card">


        <!-- ==========================================
             EXAMS
        =========================================== -->

        <h2>Exams</h2>

        <div id="exams-result" class="panel">
        </div>


        <!-- ==========================================
             RESET EXAMS
        =========================================== -->

        <h2>Reset My Exams</h2>

        <button
            id="reset-exams-btn"
            type="button"
        >
            Reset My Exams
        </button>

        <div
            id="reset-exams-result"
            class="panel"
        >
        </div>


        <!-- ==========================================
             FIND EXAM BY ID
        =========================================== -->

        <h2>Find Exam by ID</h2>

        <form id="exam-by-id-form">

            <label for="exam_id">
                Exam ID
            </label>

            <input
                id="exam_id"
                name="exam_id"
                type="text"
                min="1"
                placeholder="Enter exam ID"
                required
            >

            <button type="submit">
                Get Exam
            </button>

        </form>

        <div
            id="exam-result"
            class="panel"
        >
        </div>


        <!-- ==========================================
             FIND EXAMS BY COURSE ID
        =========================================== -->

        <h2>Find Exams by Course ID</h2>

        <form id="exams-by-course-form">

            <label for="course_id">
                Course ID
            </label>

            <input
                id="course_id"
                name="course_id"
                type="text"
                placeholder="Example: 101"
                required
            >

            <button type="submit">
                Find Exams
            </button>

        </form>

        <div
            id="course-result"
            class="panel"
        >
        </div>


    </section>

</main>



<script>


/*
==================================================
API
==================================================
*/

const API_URL = "/exams-api";


/*
==================================================
GET CURRENT USER FROM LOCAL STORAGE
==================================================

The main Exams page stores the logged-in user as:

localStorage.setItem("user", ...)

So we read the same value here.

*/

function readUser() {

    try {

        const raw =
            localStorage.getItem("user");

        return raw
            ? JSON.parse(raw)
            : null;

    } catch (error) {

        console.error(
            "Could not read user from localStorage:",
            error
        );

        return null;

    }

}


const currentUser =
    readUser();


/*
==================================================
GET USER ID
==================================================

Supports either:

{
    "id": 5
}

or:

{
    "user_id": 5
}

*/

const userId =
    currentUser
        ? (
            currentUser.user_id ??
            currentUser.id
        )
        : null;


/*
==================================================
CHECK LOGIN
==================================================
*/

if (!currentUser || userId == null) {

    window.location.href =
        "/login.html";

}


/*
==================================================
FORM ELEMENTS
==================================================
*/

const examByIdForm =
    document.getElementById(
        "exam-by-id-form"
    );


const examsByCourseForm =
    document.getElementById(
        "exams-by-course-form"
    );


/*
==================================================
RESET ELEMENTS
==================================================
*/

const resetExamsButton =
    document.getElementById(
        "reset-exams-btn"
    );


const resetExamsResult =
    document.getElementById(
        "reset-exams-result"
    );


/*
==================================================
CURRENT USER'S EXAMS URL
==================================================
*/

function getUserExamsUrl() {

    return `${API_URL}/exams?student_id=${encodeURIComponent(
        userId
    )}`;

}


/*
==================================================
DISPLAY EXAMS
==================================================
*/

async function renderIntoPanel(
    panelId,
    url
) {

    const panel =
        document.getElementById(
            panelId
        );


    panel.innerHTML =
        "<p>Loading...</p>";


    try {

        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!response.ok) {

            panel.innerHTML =
                `<p>${data.error ||
                "Request failed."
                }</p>`;

            return;
        }


        const exams =
            Array.isArray(data)
                ? data
                : [data];


        if (exams.length === 0) {

            panel.innerHTML =
                "<p>No exams found.</p>";

            return;
        }


        let table = `

            <table>

                <thead>

                    <tr>

                        <th>Exam ID</th>

                        <th>Course ID</th>

                        <th>Student ID</th>

                        <th>Exam Name</th>

                        <th>Exam Date</th>

                        <th>Exam Time</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

        `;


        exams.forEach(
            exam => {

                const statusClass =
                    exam.status === "Completed"
                        ? "status-completed"
                        : "status-uncompleted";


                table += `

                    <tr>

                        <td>
                            ${exam.exam_id}
                        </td>

                        <td>
                            ${exam.course_id}
                        </td>

                        <td>
                            ${exam.student_id}
                        </td>

                        <td>
                            ${exam.exam_name}
                        </td>

                        <td>
                            ${exam.exam_date}
                        </td>

                        <td>
                            ${exam.exam_time}
                        </td>

                        <td>

                            <button

                                class="status-btn ${statusClass}"

                                onclick="
                                    toggleStatus(
                                        ${exam.exam_id},
                                        '${exam.status}'
                                    )
                                "

                            >

                                ${exam.status}

                            </button>

                        </td>

                        <td>

                            <div class="actions">

                                <button

                                    class="delete-btn"

                                    onclick="
                                        deleteExam(
                                            ${exam.exam_id}
                                        )
                                    "

                                >

                                    Delete

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }
        );


        table += `

                </tbody>

            </table>

        `;


        panel.innerHTML =
            table;


    } catch (error) {

        console.error(error);


        panel.innerHTML =
            `
            <p>
                Request failed.
            </p>

            <pre>
                ${error}
            </pre>
            `;

    }

}


/*
==================================================
REFRESH USER EXAMS
==================================================
*/

function refreshUserExams() {

    renderIntoPanel(
        "exams-result",
        getUserExamsUrl()
    );

}


/*
==================================================
TOGGLE EXAM STATUS
==================================================
*/

async function toggleStatus(
    examId,
    currentStatus
) {

    const newStatus =
        currentStatus === "Completed"
            ? "Uncompleted"
            : "Completed";


    try {

        const response =
            await fetch(

                `${API_URL}/exams/${encodeURIComponent(
                    examId
                )}`,

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Failed to update exam status."
            );

            return;
        }


        refreshUserExams();


    } catch (error) {

        console.error(error);

        alert(
            "Request failed."
        );

    }

}


/*
==================================================
DELETE EXAM
==================================================
*/

async function deleteExam(
    examId
) {

    const confirmed =
        confirm(
            `Are you sure you want to delete exam ${examId}?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(

                `${API_URL}/exams/${encodeURIComponent(
                    examId
                )}`,

                {

                    method: "DELETE"

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Failed to delete exam."
            );

            return;
        }


        alert(
            "Exam deleted successfully."
        );


        refreshUserExams();


    } catch (error) {

        console.error(error);

        alert(
            "Request failed."
        );

    }

}


/*
==================================================
FIND EXAM BY ID
==================================================
*/

examByIdForm.addEventListener(

    "submit",

    async event => {

        event.preventDefault();


        const examId =
            document.getElementById(
                "exam_id"
            ).value.trim();


        const panel =
            document.getElementById(
                "exam-result"
            );


        panel.innerHTML =
            "<p>Loading...</p>";


        try {

            const response =
                await fetch(

                    `${API_URL}/exams/by-id?exam_id=${encodeURIComponent(
                        examId
                    )}`

                );


            const exam =
                await response.json();


            if (!response.ok) {

                panel.innerHTML =
                    `<p>${exam.error ||
                    "Exam not found."
                    }</p>`;

                return;

            }


            /*
             * Make sure the exam belongs
             * to the logged-in user.
             */

            if (

                String(exam.student_id) !==
                String(userId)

            ) {

                panel.innerHTML =
                    "<p>Exam not found for this user.</p>";

                return;

            }


            const statusClass =
                exam.status === "Completed"
                    ? "status-completed"
                    : "status-uncompleted";


            panel.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>Exam ID</th>

                            <th>Course ID</th>

                            <th>Student ID</th>

                            <th>Exam Name</th>

                            <th>Exam Date</th>

                            <th>Exam Time</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>
                                ${exam.exam_id}
                            </td>

                            <td>
                                ${exam.course_id}
                            </td>

                            <td>
                                ${exam.student_id}
                            </td>

                            <td>
                                ${exam.exam_name}
                            </td>

                            <td>
                                ${exam.exam_date}
                            </td>

                            <td>
                                ${exam.exam_time}
                            </td>

                            <td>

                                <button

                                    class="status-btn ${statusClass}"

                                    onclick="
                                        toggleStatus(
                                            ${exam.exam_id},
                                            '${exam.status}'
                                        )
                                    "

                                >

                                    ${exam.status}

                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            `;


        } catch (error) {

            console.error(error);


            panel.innerHTML =
                `
                <p>
                    Request failed.
                </p>

                <pre>
                    ${error}
                </pre>
                `;

        }

    }

);


/*
==================================================
FIND EXAMS BY COURSE ID
==================================================
*/

examsByCourseForm.addEventListener(

    "submit",

    async event => {

        event.preventDefault();


        const courseId =
            document.getElementById(
                "course_id"
            ).value.trim();


        const panel =
            document.getElementById(
                "course-result"
            );


        panel.innerHTML =
            "<p>Loading...</p>";


        try {

            const response =
                await fetch(

                    `${API_URL}/exams/by-course?course_id=${encodeURIComponent(
                        courseId
                    )}`

                );


            const data =
                await response.json();


            if (!response.ok) {

                panel.innerHTML =
                    `<p>${data.error ||
                    "No exams found."
                    }</p>`;

                return;

            }


            const exams =
                Array.isArray(data)
                    ? data
                    : [data];


            /*
             * Only show this user's exams.
             */

            const userExams =
                exams.filter(

                    exam =>

                        String(
                            exam.student_id
                        ) ===

                        String(
                            userId
                        )

                );


            if (
                userExams.length === 0
            ) {

                panel.innerHTML =
                    "<p>No exams found for this user.</p>";

                return;

            }


            let table = `

                <table>

                    <thead>

                        <tr>

                            <th>Exam ID</th>

                            <th>Course ID</th>

                            <th>Student ID</th>

                            <th>Exam Name</th>

                            <th>Exam Date</th>

                            <th>Exam Time</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            userExams.forEach(

                exam => {

                    const statusClass =
                        exam.status === "Completed"
                            ? "status-completed"
                            : "status-uncompleted";


                    table += `

                        <tr>

                            <td>
                                ${exam.exam_id}
                            </td>

                            <td>
                                ${exam.course_id}
                            </td>

                            <td>
                                ${exam.student_id}
                            </td>

                            <td>
                                ${exam.exam_name}
                            </td>

                            <td>
                                ${exam.exam_date}
                            </td>

                            <td>
                                ${exam.exam_time}
                            </td>

                            <td>

                                <button

                                    class="status-btn ${statusClass}"

                                    onclick="
                                        toggleStatus(
                                            ${exam.exam_id},
                                            '${exam.status}'
                                        )
                                    "

                                >

                                    ${exam.status}

                                </button>

                            </td>

                        </tr>

                    `;

                }

            );


            table += `

                    </tbody>

                </table>

            `;


            panel.innerHTML =
                table;


        } catch (error) {

            console.error(error);


            panel.innerHTML =
                `
                <p>
                    Request failed.
                </p>

                <pre>
                    ${error}
                </pre>
                `;

        }

    }

);


/*
==================================================
RESET MY EXAMS
==================================================
*/

resetExamsButton.addEventListener(

    "click",

    async () => {


        const confirmed =
            confirm(

                "This will remove all your existing exams and replace them with fresh exams. Continue?"

            );


        if (!confirmed) {

            return;

        }


        resetExamsResult.innerHTML =
            "<p>Resetting your exams...</p>";


        try {

            const response =
                await fetch(

                    `${API_URL}/exams/reset?student_id=${encodeURIComponent(
                        userId
                    )}`,

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        }

                    }

                );


            const data =
                await response.json();


            if (!response.ok) {

                resetExamsResult.innerHTML =
                    `<p>${data.error ||
                    "Failed to reset exams."
                    }</p>`;

                return;

            }


            resetExamsResult.innerHTML =
                `<p>${data.message ||
                "Exams reset successfully."
                }</p>`;


            refreshUserExams();


        } catch (error) {

            console.error(error);


            resetExamsResult.innerHTML =
                "<p>Failed to reset exams.</p>";

        }

    }

);


/*
==================================================
LOAD CURRENT USER'S EXAMS
==================================================
*/

refreshUserExams();


</script>

</body>

</html>
