<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>Exams</title>

    <link rel="stylesheet" href="../css/styles.css">

    <style>

        body {
            margin: 0;
            min-height: auto;
            background: transparent;
        }

        .app-shell {
            max-width: none;
            padding: 26px 30px 40px;
        }

        .exam-table-scroll {
            max-height: 390px;
            overflow-y: auto;
            overflow-x: auto;
        }

        .exam-table-scroll table {
            width: 100%;
            border-collapse: collapse;
        }

        .exam-table-scroll th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: white;
        }

    </style>

</head>


<body>


<main class="app-shell">

    <section class="card">


        <!-- ==========================================
             EXAMS
        =========================================== -->

        <h2>My Exams</h2>

        <div
            id="exams-result"
            class="panel"
        ></div>


        <!-- ==========================================
             RESET EXAMS
        =========================================== -->

        <h2>Reset My Exams</h2>

        <button
            id="reset-exams-btn"
            type="button"
        >
            Reset My Exams
        </button>

        <div
            id="reset-exams-result"
            class="panel"
        ></div>


        <!-- ==========================================
             ADD EXAM
        =========================================== -->

        <h2>Add Exam</h2>

        <form id="add-exam-form">

            <label for="add-course-id">
                Course ID
            </label>

            <input
                id="add-course-id"
                name="course_id"
                type="text"
                placeholder="Example: 101"
                required
            >

            <label for="add-exam-name">
                Exam Name
            </label>

            <input
                id="add-exam-name"
                name="exam_name"
                type="text"
                placeholder="Example: Mathematics Final"
                required
            >

            <label for="add-exam-date">
                Exam Date
            </label>

            <input
                id="add-exam-date"
                name="exam_date"
                type="date"
                required
            >

            <label for="add-exam-time">
                Exam Time
            </label>

            <input
                id="add-exam-time"
                name="exam_time"
                type="time"
                required
            >

            <button type="submit">
                Add Exam
            </button>

        </form>

        <div
            id="add-exam-result"
            class="panel"
        ></div>


        <!-- ==========================================
             FIND EXAMS BY COURSE ID
        =========================================== -->

        <h2>Find Exams by Course ID</h2>

        <form id="exams-by-course-form">

            <label for="course_id">
                Course ID
            </label>

            <input
                id="course_id"
                name="course_id"
                type="text"
                placeholder="Example: 101"
                required
            >

            <button type="submit">
                Find Exams
            </button>

        </form>

        <div
            id="course-result"
            class="panel"
        ></div>


        <!-- ==========================================
             ASK LOCAL AI AGENT
        =========================================== -->

        <h2>Ask Local AI Agent</h2>

        <form id="ask-with-context-form">

            <label for="context-question">
                Question
            </label>

            <textarea
                id="context-question"
                name="question"
                rows="4"
                placeholder="Ask something about your exams..."
                required
            >Explain my exams.</textarea>

            <button type="submit">
                Ask With Context
            </button>

        </form>

        <div
            id="context-result"
            class="panel"
        ></div>


    </section>

</main>


<script>


/* ==========================================
   API
========================================== */

const API_URL = "/exams-api";


/* ==========================================
   GET CURRENT USER
========================================== */

function readUser() {

    try {

        const raw =
            localStorage.getItem("user");

        return raw
            ? JSON.parse(raw)
            : null;

    } catch (error) {

        console.error(
            "Could not read user from localStorage:",
            error
        );

        return null;

    }

}


const currentUser = readUser();


const userId =
    currentUser
        ? (
            currentUser.user_id ??
            currentUser.id
        )
        : null;


/* ==========================================
   CHECK LOGIN
========================================== */

if (
    !currentUser ||
    userId == null
) {

    window.location.href =
        "/login.html";

}


/* ==========================================
   FORM ELEMENTS
========================================== */

const addExamForm =
    document.getElementById(
        "add-exam-form"
    );

const addExamResult =
    document.getElementById(
        "add-exam-result"
    );

const examsByCourseForm =
    document.getElementById(
        "exams-by-course-form"
    );

const resetExamsButton =
    document.getElementById(
        "reset-exams-btn"
    );

const resetExamsResult =
    document.getElementById(
        "reset-exams-result"
    );

const askWithContextForm =
    document.getElementById(
        "ask-with-context-form"
    );


/* ==========================================
   USER EXAMS URL
========================================== */

function getUserExamsUrl() {

    return `${API_URL}/exams?student_id=${encodeURIComponent(
        userId
    )}`;

}


/* ==========================================
   SORT EXAMS BY DATE AND TIME
========================================== */

function sortExams(exams) {

    return exams.sort(
        (a, b) => {

            const dateA =
                new Date(
                    `${a.exam_date}T${a.exam_time || "00:00"}`
                );

            const dateB =
                new Date(
                    `${b.exam_date}T${b.exam_time || "00:00"}`
                );

            return dateA - dateB;

        }
    );

}


/* ==========================================
   CREATE EXAM TABLE
========================================== */

function createExamTable(
    exams,
    showActions = true
) {

    sortExams(exams);

    return `

        <div class="exam-table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>Course ID</th>

                        <th>Exam Name</th>

                        <th>Exam Date</th>

                        <th>Exam Time</th>

                        <th>Status</th>

                        ${
                            showActions
                                ? "<th>Actions</th>"
                                : ""
                        }

                    </tr>

                </thead>

                <tbody>

                    ${exams.map(
                        exam => {

                            const statusClass =
                                exam.status === "Completed"
                                    ? "status-completed"
                                    : "status-uncompleted";

                            return `

                                <tr>

                                    <td>
                                        ${exam.course_id}
                                    </td>

                                    <td>
                                        ${exam.exam_name}
                                    </td>

                                    <td>
                                        ${exam.exam_date}
                                    </td>

                                    <td>
                                        ${exam.exam_time}
                                    </td>

                                    <td>

                                        <button
                                            class="status-btn ${statusClass}"
                                            onclick="
                                                toggleStatus(
                                                    ${exam.exam_id},
                                                    '${exam.status}'
                                                )
                                            "
                                        >
                                            ${exam.status}
                                        </button>

                                    </td>

                                    ${
                                        showActions
                                            ? `

                                                <td>

                                                    <div class="actions">

                                                        <button
                                                            class="delete-btn"
                                                            onclick="
                                                                deleteExam(
                                                                    ${exam.exam_id}
                                                                )
                                                            "
                                                        >
                                                            Delete
                                                        </button>

                                                    </div>

                                                </td>

                                            `
                                            : ""
                                    }

                                </tr>

                            `;

                        }
                    ).join("")}

                </tbody>

            </table>

        </div>

    `;

}


/* ==========================================
   DISPLAY EXAMS
========================================== */

async function renderIntoPanel(
    panelId,
    url,
    showActions = true
) {

    const panel =
        document.getElementById(
            panelId
        );

    panel.innerHTML =
        "<p>Loading...</p>";

    try {

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (!response.ok) {

            panel.innerHTML =
                `<p>${data.error ||
                "Request failed."
                }</p>`;

            return;

        }

        const exams =
            Array.isArray(data)
                ? data
                : [data];

        if (
            exams.length === 0
        ) {

            panel.innerHTML =
                "<p>No exams found.</p>";

            return;

        }

        panel.innerHTML =
            createExamTable(
                exams,
                showActions
            );

    } catch (error) {

        console.error(error);

        panel.innerHTML =
            `
            <p>
                Request failed.
            </p>

            <pre>${error}</pre>
            `;

    }

}


/* ==========================================
   REFRESH USER EXAMS
========================================== */

function refreshUserExams() {

    renderIntoPanel(
        "exams-result",
        getUserExamsUrl()
    );

}


/* ==========================================
   ADD EXAM
========================================== */

addExamForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        addExamResult.innerHTML =
            "<p>Adding exam...</p>";

        const courseId =
            document.getElementById(
                "add-course-id"
            ).value.trim();

        const examName =
            document.getElementById(
                "add-exam-name"
            ).value.trim();

        const examDate =
            document.getElementById(
                "add-exam-date"
            ).value;

        const examTime =
            document.getElementById(
                "add-exam-time"
            ).value;

        try {

            const response =
                await fetch(
                    `${API_URL}/exams`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                student_id:
                                    userId,

                                course_id:
                                    courseId,

                                exam_name:
                                    examName,

                                exam_date:
                                    examDate,

                                exam_time:
                                    examTime

                            })

                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                addExamResult.innerHTML =
                    `<p>${data.error ||
                    "Failed to add exam."
                    }</p>`;

                return;

            }

            addExamResult.innerHTML =
                `<p>${data.message ||
                "Exam added successfully."
                }</p>`;

            addExamForm.reset();

            refreshUserExams();

        } catch (error) {

            console.error(error);

            addExamResult.innerHTML =
                `
                <p>
                    Failed to add exam.
                </p>

                <pre>${error}</pre>
                `;

        }

    }
);


/* ==========================================
   TOGGLE EXAM STATUS
========================================== */

async function toggleStatus(
    examId,
    currentStatus
) {

    const newStatus =
        currentStatus === "Completed"
            ? "Uncompleted"
            : "Completed";

    try {

        const response =
            await fetch(
                `${API_URL}/exams/${encodeURIComponent(
                    examId
                )}`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status: newStatus
                        })

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Failed to update exam status."
            );

            return;

        }

        refreshUserExams();

    } catch (error) {

        console.error(error);

        alert(
            "Request failed."
        );

    }

}


/* ==========================================
   DELETE EXAM
========================================== */

async function deleteExam(
    examId
) {

    if (
        !confirm(
            "Are you sure you want to delete this exam?"
        )
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                `${API_URL}/exams/${encodeURIComponent(
                    examId
                )}`,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Failed to delete exam."
            );

            return;

        }

        alert(
            "Exam deleted successfully."
        );

        refreshUserExams();

    } catch (error) {

        console.error(error);

        alert(
            "Request failed."
        );

    }

}


/* ==========================================
   FIND EXAMS BY COURSE ID
========================================== */

examsByCourseForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const courseId =
            document.getElementById(
                "course_id"
            ).value.trim();

        const panel =
            document.getElementById(
                "course-result"
            );

        panel.innerHTML =
            "<p>Loading...</p>";

        try {

            const response =
                await fetch(
                    `${API_URL}/exams/by-course?course_id=${encodeURIComponent(
                        courseId
                    )}`
                );

            const data =
                await response.json();

            if (!response.ok) {

                panel.innerHTML =
                    `<p>${data.error ||
                    "No exams found."
                    }</p>`;

                return;

            }

            const exams =
                (
                    Array.isArray(data)
                        ? data
                        : [data]
                ).filter(
                    exam =>
                        String(
                            exam.student_id
                        ) ===
                        String(userId)
                );

            if (
                exams.length === 0
            ) {

                panel.innerHTML =
                    "<p>No exams found for this user.</p>";

                return;

            }

            panel.innerHTML =
                createExamTable(
                    exams,
                    false
                );

        } catch (error) {

            console.error(error);

            panel.innerHTML =
                `
                <p>
                    Request failed.
                </p>

                <pre>${error}</pre>
                `;

        }

    }
);


/* ==========================================
   RESET EXAMS
========================================== */

resetExamsButton.addEventListener(
    "click",
    async () => {

        if (
            !confirm(
                "This will remove all your existing exams and replace them with fresh exams. Continue?"
            )
        ) {

            return;

        }

        resetExamsResult.innerHTML =
            "<p>Resetting your exams...</p>";

        try {

            const response =
                await fetch(
                    `${API_URL}/exams/reset?student_id=${encodeURIComponent(
                        userId
                    )}`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        }

                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                resetExamsResult.innerHTML =
                    `<p>${data.error ||
                    "Failed to reset exams."
                    }</p>`;

                return;

            }

            resetExamsResult.innerHTML =
                `<p>${data.message ||
                "Exams reset successfully."
                }</p>`;

            refreshUserExams();

        } catch (error) {

            console.error(error);

            resetExamsResult.innerHTML =
                "<p>Failed to reset exams.</p>";

        }

    }
);


/* ==========================================
   ASK LOCAL AI AGENT
========================================== */

askWithContextForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const panel =
            document.getElementById(
                "context-result"
            );

        const question =
            document.getElementById(
                "context-question"
            ).value.trim();

        if (!question) {

            panel.innerHTML =
                "<p>Please enter a question.</p>";

            return;

        }

        panel.innerHTML =
            "<p>Thinking...</p>";

        const formData =
            new URLSearchParams();

        formData.append(
            "question",
            question
        );

        formData.append(
            "student_id",
            userId
        );

        try {

            const response =
                await fetch(
                    `${API_URL}/ask-with-context`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            formData.toString()

                    }
                );

            const body =
                await response.text();

            if (!response.ok) {

                panel.innerHTML =
                    `
                    <p>
                        Request failed.
                    </p>

                    <pre>${body}</pre>
                    `;

                return;

            }

            panel.innerHTML =
                body;

        } catch (error) {

            console.error(error);

            panel.innerHTML =
                `
                <p>
                    Request failed.
                </p>

                <pre>${error}</pre>
                `;

        }

    }
);


/* ==========================================
   LOAD EXAMS
========================================== */

refreshUserExams();

</script>

</body>

</html>
