    <script>


        /*
        ==================================================
        GET USER ID FROM URL
        ==================================================
        
        Example:
        
        http://localhost:8084/tabs/normal.html?user_id=5&name=John
        
        */

        function getUserIdFromUrl() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("user_id");
        }


        /*

        CURRENT USER
        ==================================================
        */

            document.getElementById(

            );


        const examsByCourseForm =
            document.getElementById(

            );


        /*
        ==================================================
        DISPLAY EXAMS
        ==================================================
        */

        async function renderIntoPanel(
            panelId,
            url
        ) {

            const panel =
                document.getElementById(
                    panelId
                );


            try {

                const response =
                    await fetch(url);


                const data =
                    await response.json();


                if (!response.ok) {

                    panel.innerHTML =
                        `<p>${data.error ||
                        "Request failed."
                        }</p>`;

                    return;
                }


                const exams =
                    Array.isArray(data)
                        ? data
                        : [data];


                if (exams.length === 0) {

                    panel.innerHTML =
                        "<p>No exams found.</p>";

                    return;
                }


                let table = `

            <table>

                <thead>

                    <tr>

                        <th>Exam ID</th>

                        <th>Course ID</th>

                        <th>Student ID</th>

                        <th>Exam Name</th>

                        <th>Exam Date</th>

                        <th>Exam Time</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody>

        `;


                exams.forEach(
                    exam => {

                        table += `

                    <tr>

                        <td>
                            ${exam.exam_id}
                        </td>

                        <td>
                            ${exam.course_id}
                        </td>

                        <td>
                            ${exam.student_id}
                        </td>

                        <td>
                            ${exam.exam_name}
                        </td>

                        <td>
                            ${exam.exam_date}
                        </td>

                        <td>
                            ${exam.exam_time}
                        </td>

                        <td>

                            <button

                                class="status-btn ${exam.status ===
                                "Completed"

                                ? "status-completed"

                                : "status-uncompleted"
                            }"

                                onclick="
                                    toggleStatus(
                                        ${exam.exam_id},
                                        '${exam.status}'
                                    )
                                "

                            >

                                ${exam.status}

                            </button>

                        </td>


                        <td>

                            <div class="actions">

                                <button

                                    class="delete-btn"

                                    onclick="
                                        deleteExam(
                                            ${exam.exam_id}
                                        )
                                    "

                                >

                                    Delete

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

                    }
                );


                table += `

                </tbody>

            </table>

        `;


                panel.innerHTML =
                    table;


            } catch (error) {

                console.error(error);


                panel.innerHTML =
                    `<p>
                Request failed.
            </p>

            <pre>
                ${error}
            </pre>`;

            }

        }

        const response = await fetch(
            `${API_URL}/exams/${examId}`,
            {

        /*
        ==================================================
        TOGGLE EXAM STATUS
        ==================================================
        */

        async function toggleStatus(
            examId,
            currentStatus
        ) {


            const newStatus =
                currentStatus === "Completed"
                    ? "Uncompleted"
                    : "Completed";


            try {

                const response =
                    await fetch(

                        `http://localhost:5009/exams/${examId}`,

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    status:
                                        newStatus

                                })

                        }

                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.error ||
                        "Failed to update exam status."
                    );

                    return;
                }


                /*
                 * Refresh current user's exams
                 */

                renderIntoPanel(

                    "exams-result",

                    `http://localhost:5009/exams?student_id=${encodeURIComponent(userId)
                    }`

                );


            } catch (error) {

                alert(
                    "Request failed."
                );

            }

        }

                renderIntoPanel(

                try {

                    if (!response.ok) {

                                        )
                                    "

                                >

                                </button>

                    </tbody>

                </table>

            `;


                } catch (error) {

                    panel.innerHTML =

                </p>

                <pre>

                </pre>`;

                }

        );


        /*

        ==================================================
        */

        examsByCourseForm.addEventListener(

            "submit",

            async event => {

                event.preventDefault();


                const formData =
                    new FormData(
                        examsByCourseForm
                    );


                const query =
                    new URLSearchParams(
                        formData
                    ).toString();


                const panel =
                    document.getElementById(
                        "course-result"
                    );


                try {

                    const response =
                        await fetch(

                            `http://localhost:5009/exams/by-course?${query}`

                        );


                    const exams =
                        await response.json();


                    if (!response.ok) {

                        panel.innerHTML =
                            `<p>${exams.error ||
                            "No exams found."
                            }</p>`;

                        return;

                    }


                    /*
                     * Only show exams belonging
                     * to the current user.
                     */

                    const userExams =
                        exams.filter(

                            exam =>

                                String(
                                    exam.student_id
                                ) ===

                                String(
                                    userId
                                )

                        );


                    if (
                        userExams.length === 0
                    ) {

                        panel.innerHTML =
                            "<p>No exams found for this user.</p>";

                        return;

                    }


                    let table = `

                <table>

                    <thead>

                        <tr>

                            <th>Exam ID</th>

                            <th>Course ID</th>

                            <th>Student ID</th>

                            <th>Exam Name</th>

                            <th>Exam Date</th>

                            <th>Exam Time</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody>

            `;


                    userExams.forEach(

                        exam => {

                            table += `

                        <tr>

                            <td>
                                ${exam.exam_id}

                            <td>

                            <td>

                            <td>

                            <td>

                                }"

                                            '${exam.status}'
                                        )
                                    "

                                >

                        }

                    );


                    table += `

                    </tbody>

                </table>

            `;


                    panel.innerHTML =
                        table;


                } catch (error) {

                    panel.innerHTML =
                        `<p>
                    Request failed.
                </p>

                <pre>
                    ${error}
                </pre>`;

                }

            }

        );


        /*
        ==================================================
        RESET MY EXAMS
        ==================================================
        
        This removes the current user's existing exams
        and creates fresh exams.
        
        ==================================================
        */

        const resetExamsButton =
            document.getElementById(
                "reset-exams-btn"
            );


        const resetExamsResult =
            document.getElementById(
                "reset-exams-result"
            );


        resetExamsButton.addEventListener(

            "click",

            async () => {


                if (!userId) {

                    resetExamsResult.innerHTML =
                        "<p>No user ID was provided in the URL.</p>";

                    return;

                }


                const confirmed =
                    confirm(

                        "This will remove all your existing exams and replace them with fresh exams. Continue?"

                    );


                if (!confirmed) {

                    return;

                }


                resetExamsResult.innerHTML =
                    "<p>Resetting your exams...</p>";


                try {


                    /*
                     * ==================================================
                     * API CALL - CHANGE THIS IF NEEDED
                     * ==================================================
                     *
                     * This calls your exam backend.
                     *
                     * The backend should:
                     *
                     * 1. Find the courses for this student.
                     * 2. Delete their existing exams.
                     * 3. Create fresh exams from the course templates.
                     *
                     */

                    const response =
                        await fetch(

                            `http://localhost:5009/exams/reset?student_id=${encodeURIComponent(userId)
                            }`,

                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                }

                            }

                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        resetExamsResult.innerHTML =
                            `<p>${data.error ||
                            "Failed to reset exams."
                            }</p>`;

                        return;

                    }


                    resetExamsResult.innerHTML =
                        `<p>${data.message ||
                        "Exams reset successfully."
                        }</p>`;


                    /*
                     * Refresh the exam table
                     */

                    renderIntoPanel(

                        "exams-result",

                        `http://localhost:5009/exams?student_id=${encodeURIComponent(userId)
                        }`

                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    resetExamsResult.innerHTML =
                        "<p>Failed to reset exams.</p>";

                }

            }

        );


        /*
        ==================================================
        LOAD CURRENT USER'S EXAMS
        ==================================================
        */

        if (userId) {


            renderIntoPanel(

                "exams-result",

                `http://localhost:5009/exams?student_id=${encodeURIComponent(userId)
                }`

            );


        } else {


            document.getElementById(

renderIntoPanel(
