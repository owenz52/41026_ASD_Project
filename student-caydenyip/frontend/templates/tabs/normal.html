<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Exams</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<main class="app-shell">

    <section class="card">

        <h2>Exams</h2>

        <div id="exams-result" class="panel"></div>


        <h2>Find Exam by ID</h2>

        <form id="exam-by-id-form">

            <label for="exam_id">
                Exam ID
            </label>

            <input
                id="exam_id"
                name="exam_id"
                type="text"
                min="1"
                placeholder="Enter exam ID"
                required
            >

            <button type="submit">
                Get Exam
            </button>

        </form>

        <div id="exam-result" class="panel"></div>


        <h2>Find Exams by Course ID</h2>

        <form id="exams-by-course-form">

            <label for="course_id">
                Course ID
            </label>

            <input
                id="course_id"
                name="course_id"
                type="text"
                placeholder="Example: 101"
                required
            >

            <button type="submit">
                Find Exams
            </button>

        </form>

        <div id="course-result" class="panel"></div>

    </section>

</main>


<script>

const API_URL = "/exams-api";

const examByIdForm =
    document.getElementById("exam-by-id-form");

const examsByCourseForm =
    document.getElementById("exams-by-course-form");


/*
 * Display exams
 */

async function renderIntoPanel(panelId, url) {

    const panel =
        document.getElementById(panelId);

    try {

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (!response.ok) {

            panel.innerHTML =
                `<p>${data.error || "Request failed."}`;

            return;
        }

        const exams =
            Array.isArray(data) ? data : [data];

        if (exams.length === 0) {

            panel.innerHTML =
                "<p>No exams found.</p>";

            return;
        }


        let table = `
            <table>

                <thead>

                    <tr>
                        <th>Exam ID</th>
                        <th>Course ID</th>
                        <th>Student ID</th>
                        <th>Exam Name</th>
                        <th>Exam Date</th>
                        <th>Exam Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody>
        `;


        exams.forEach(exam => {

            table += `
                <tr>

                    <td>${exam.exam_id}</td>

                    <td>${exam.course_id}</td>

                    <td>${exam.student_id}</td>

                    <td>${exam.exam_name}</td>

                    <td>${exam.exam_date}</td>

                    <td>${exam.exam_time}</td>

                    <td>
                        <button
                            class="status-btn ${exam.status === "Completed"
                                ? "status-completed"
                                : "status-uncompleted"}"
                            onclick="toggleStatus(
                                ${exam.exam_id},
                                '${exam.status}'
                            )"
                        >
                            ${exam.status}
                        </button>
                    </td>

                    <td>
                        <div class="actions">

                            <button
                                class="delete-btn"
                                onclick="deleteExam(${exam.exam_id})"
                            >
                                Delete
                            </button>

                        </div>
                    </td>

                </tr>
            `;

        });


        table += `
                </tbody>

            </table>
        `;

        panel.innerHTML = table;

    } catch (error) {

        panel.innerHTML =
            `<p>Request failed.</p><pre>${error}</pre>`;

    }
}


/*
 * Toggle exam completion status
 */

async function toggleStatus(examId, currentStatus) {

    const newStatus =
        currentStatus === "Completed"
            ? "Uncompleted"
            : "Completed";


    try {

        const response = await fetch(
            `${API_URL}/exams/${examId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: newStatus
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Failed to update exam status."
            );

            return;
        }


        /*
         * Refresh the exams table
         */

        renderIntoPanel(
            "exams-result",
            `${API_URL}/exams`
        );

    } catch (error) {

        alert("Request failed.");

    }
}


/*
 * Delete exam
 */

async function deleteExam(examId) {

    const confirmed =
        confirm(
            `Are you sure you want to delete exam ${examId}?`
        );

    if (!confirmed) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/exams/${examId}`,
            {
                method: "DELETE"
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Failed to delete exam."
            );

            return;
        }


        alert("Exam deleted successfully.");


        renderIntoPanel(
            "exams-result",
            `${API_URL}/exams`
        );

    } catch (error) {

        alert("Request failed.");

    }

}


/*
 * Find Exam by ID
 */

examByIdForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const examId =
        document.getElementById("exam_id").value;

    const panel =
        document.getElementById("exam-result");

    try {

        const response = await fetch(
            `${API_URL}/exams/by-id?exam_id=${examId}`
        );

        const exam =
            await response.json();


        if (!response.ok) {

            panel.innerHTML =
                `<p>${exam.error || "Exam not found."}</p>`;

            return;
        }


        panel.innerHTML = `

            <table>

                <thead>

                    <tr>
                        <th>Exam ID</th>
                        <th>Course ID</th>
                        <th>Student ID</th>
                        <th>Exam Name</th>
                        <th>Exam Date</th>
                        <th>Exam Time</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>${exam.exam_id}</td>

                        <td>${exam.course_id}</td>

                        <td>${exam.student_id}</td>

                        <td>${exam.exam_name}</td>

                        <td>${exam.exam_date}</td>

                        <td>${exam.exam_time}</td>

                        <td>
                            <button
                                class="status-btn ${
                                    exam.status === "Completed"
                                        ? "status-completed"
                                        : "status-uncompleted"
                                }"
                                onclick="toggleStatus(
                                    ${exam.exam_id},
                                    '${exam.status}'
                                )"
                            >
                                ${exam.status}
                            </button>
                        </td>

                    </tr>

                </tbody>

            </table>

        `;

    } catch (error) {

        panel.innerHTML =
            `<p>Request failed.</p><pre>${error}</pre>`;

    }

});


/*
 * Find Exams by Course ID
 */

examsByCourseForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const formData =
        new FormData(examsByCourseForm);

    const query =
        new URLSearchParams(formData).toString();

    const panel =
        document.getElementById("course-result");

    try {

        const response = await fetch(
            `${API_URL}/exams/by-course?${query}`
        );

        const exams =
            await response.json();


        if (!response.ok) {

            panel.innerHTML =
                `<p>${exams.error || "No exams found."}`;

            return;
        }


        if (exams.length === 0) {

            panel.innerHTML =
                "<p>No exams found.</p>";

            return;
        }


        let table = `

            <table>

                <thead>

                    <tr>
                        <th>Exam ID</th>
                        <th>Course ID</th>
                        <th>Student ID</th>
                        <th>Exam Name</th>
                        <th>Exam Date</th>
                        <th>Exam Time</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

        `;


        exams.forEach(exam => {

            table += `

                <tr>

                    <td>${exam.exam_id}</td>

                    <td>${exam.course_id}</td>

                    <td>${exam.student_id}</td>

                    <td>${exam.exam_name}</td>

                    <td>${exam.exam_date}</td>

                    <td>${exam.exam_time}</td>

                    <td>

                        <button
                            class="status-btn ${
                                exam.status === "Completed"
                                    ? "status-completed"
                                    : "status-uncompleted"
                            }"
                            onclick="toggleStatus(
                                ${exam.exam_id},
                                '${exam.status}'
                            )"
                        >
                            ${exam.status}
                        </button>

                    </td>

                </tr>

            `;

        });


        table += `

                </tbody>

            </table>

        `;


        panel.innerHTML = table;

    } catch (error) {

        panel.innerHTML =
            `<p>Request failed.</p><pre>${error}</pre>`;

    }

});


/*
 * Load all exams when page opens
 */

renderIntoPanel(
    "exams-result",
    `${API_URL}/exams`
);

</script>

</body>
</html>
