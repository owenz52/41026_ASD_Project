# Compose file for the notebook services. Build contexts are relative to this
# file's own directory, so it runs standalone from student-yunchungchang/:
#     docker compose -f docker-compose.fragment.yml build
#
# When these services are merged into the team's shared root docker-compose.yml
# in Phase 2, the contexts must be rewritten as ./student-yunchungchang,
# ./student-yunchungchang/database, and ./student-yunchungchang/frontend, and
# all three services need to join whatever network that file defines (e.g.
# networks: [asd-network]).
services:
  notebook-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - BACKEND_PORT=5003
      - DATABASE_SERVICE_URL=http://notebook-database:5004
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - notebook-database

  notebook-database:
    build:
      context: ./database
    ports:
      - "5004:5004"
    environment:
      - DATABASE_PORT=5004
    volumes:
      - notebook_data:/app/data

  notebook-frontend:
    build:
      context: ./frontend
    ports:
      - "8083:80"
    depends_on:
      - notebook-backend

volumes:
  notebook_data:
