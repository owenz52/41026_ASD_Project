name: Cayden Microservice CI

on:
  push:
    paths:
      - "student-caydenyip/**"
      - "docker-compose.yml"
      - ".github/workflows/student-caydenyip.yml"

  pull_request:
    paths:
      - "student-caydenyip/**"
      - "docker-compose.yml"
      - ".github/workflows/student-caydenyip.yml"

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Build Docker services
        run: |
          docker compose -f docker-compose.yml build \
            exam-frontend \
            exam-backend \
            exam-database

      - name: Start Database
        run: |
          docker compose -f docker-compose.yml up -d \
            exam-database

      - name: Start Backend with AI, MCP and RAG disabled
        run: |
          docker compose -f docker-compose.yml run -d \
            --name cayden-exam-backend-ci \
            -e AI_ENABLED=false \
            -e MCP_ENABLED=false \
            -e RAG_ENABLED=false \
            exam-backend

      - name: Verify AI, MCP and RAG are disabled
        run: |
          echo "Checking backend feature flags..."

          AI_ENABLED=$(docker exec cayden-exam-backend-ci printenv AI_ENABLED)
          MCP_ENABLED=$(docker exec cayden-exam-backend-ci printenv MCP_ENABLED)
          RAG_ENABLED=$(docker exec cayden-exam-backend-ci printenv RAG_ENABLED)

          echo "AI_ENABLED=$AI_ENABLED"
          echo "MCP_ENABLED=$MCP_ENABLED"
          echo "RAG_ENABLED=$RAG_ENABLED"

          test "$AI_ENABLED" = "false"
          test "$MCP_ENABLED" = "false"
          test "$RAG_ENABLED" = "false"

          echo "AI, MCP and RAG are disabled for CI."

      - name: Start Frontend
        run: |
          docker compose -f docker-compose.yml up -d \
            exam-frontend

      - name: Check service status
        run: docker compose -f docker-compose.yml ps


      - name: Run Exam Backend Tests
        run: |
          pip install pytest requests
          BACKEND_SERVICE_URL=http://localhost:5009 \
          pytest -v student-caydenyip/backend/tests/test_endpoints.py


      - name: Show logs if build or services fail
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs
          docker logs cayden-exam-backend-ci || true

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.yml down -v
