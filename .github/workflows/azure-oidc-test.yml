
name: Azure OIDC Login Test

on:
  workflow_dispatch:
  push:
    branches:
      - "Cayden-pre/post-commit-update"
    paths:
      - ".github/workflows/azure-oidc-test.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test-azure-login:
    name: Verify Azure OIDC Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        shell: bash
        run: |
          echo "Azure authentication succeeded."
          az account show \
            --query "{Subscription:name,SubscriptionId:id,TenantId:tenantId}" \
            --output table

      - name: Confirm expected tenant
        shell: bash
        run: |
          ACTUAL_TENANT=$(az account show --query tenantId --output tsv)

          if [ "$ACTUAL_TENANT" != "38f98f9c-0f30-4c61-9211-4560f70cb0f4" ]; then
            echo "ERROR: Logged into an unexpected Azure tenant."
            exit 1
          fi

          echo "Tenant verification passed."
