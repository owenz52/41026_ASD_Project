name: student-yunchungchang CI

on:
  push:
    paths: ["student-yunchungchang/**"]
  pull_request:
    paths: ["student-yunchungchang/**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-yunchungchang/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  docker-build-sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: student-yunchungchang
            dockerfile: student-yunchungchang/backend/Dockerfile
          - name: database
            context: student-yunchungchang/database
            dockerfile: student-yunchungchang/database/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.context }}
