name: Yunchung Chang CI

on:
    push:
        paths:
            - "student-yunchungchang/**"
            - "docker-compose.yml"
            - ".github/workflows/student-yunchungchang-ci.yml"

    pull_request:
        paths:
            - "student-yunchungchang/**"
            - "docker-compose.yml"
            - ".github/workflows/student-yunchungchang-ci.yml"

jobs:
    docker-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build Docker services
              run: >
                  docker compose -f docker-compose.yml build
                  notebook-backend notebook-database notebook-frontend
