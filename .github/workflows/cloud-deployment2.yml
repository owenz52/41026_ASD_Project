name: cloud-deployment 2

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  post_commit_tests:
    runs-on: ubuntu-latest

    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Run post-commit tests
        run: |
          mkdir -p reports
          pip install pytest requests
          set +e
          python -m pytest tests/post_commit/ -v > reports/test-results.md 2>&1
          status=$?
          echo "{\"status\": \"$([ "$status" -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> reports/test-audit.jsonl
          exit "$status"

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-test-evidence
          path: reports/
          if-no-files-found: warn

  deploy_azure:
    runs-on: ubuntu-latest
    needs: [post_commit_tests]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up deployment environment
        run: bash scripts/env-setup.sh
        env:
          REGISTER_PROVIDERS: "false"

      - name: Create ACR
        run: bash scripts/create-acr.sh        

      - name: Build and push images
        run: bash scripts/build-images.sh

      - name: Azure login (refresh)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Container Apps environment
        run: bash scripts/deploy-azure-env.sh

      - name: Azure login (refresh again)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: bash scripts/deploy-azure.sh

      - name: Configure Backend Env
        run: bash scripts/configure-backend-env.sh      

      - name: Configure Frontend Env
        run: bash scripts/configure-portal-env.sh


      - name: Validate deployment and generate evidence
        run: bash scripts/deployment-testing.sh

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-evidence
          path: reports/deployment-results.md
          if-no-files-found: warn