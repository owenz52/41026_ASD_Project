name: cloud-deployment

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  post_commit_tests:
    runs-on: ubuntu-latest

    env:
      AI_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Run all student endpoint tests
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p reports/release2
          REPORT="reports/release2/test-results.md"
          AUDIT="reports/release2/test-audit.jsonl"

          echo "# Release 2 Endpoint Testing" > "$REPORT"
          echo "" >> "$REPORT"

          overall_status=0

          students=(
            "student-adrianvoljak"
            "student-yulinzhu"
            "student-caydenyip"
            "student-voreaksanith"
            "student-yunchungchang"
          )

          for student in "${students[@]}"; do
            echo "=== Testing $student ==="

            backend="$student/backend"
            test_file="$backend/tests/test_endpoints.py"

            echo "" >> "$REPORT"
            echo "## $student" >> "$REPORT"
            echo '```text' >> "$REPORT"

            if [[ ! -f "$test_file" ]]; then
              echo "FAIL: Missing $test_file" | tee -a "$REPORT"
              result="FAIL"
            else
              venv="/tmp/release2-tests-$student"

              if ! python -m venv "$venv"; then
                echo "FAIL: Could not create test environment" \
                  | tee -a "$REPORT"
                result="FAIL"
              elif ! "$venv/bin/python" -m pip install \
                  pytest -r "$backend/requirements.txt" \
                  >> "$REPORT" 2>&1; then
                echo "FAIL: Dependency installation failed" \
                  | tee -a "$REPORT"
                result="FAIL"
              elif PYTHONPATH="$backend" \
                  "$venv/bin/python" -m pytest \
                  "$test_file" -v \
                  >> "$REPORT" 2>&1; then
                echo "PASS: $student" | tee -a "$REPORT"
                result="PASS"
              else
                echo "FAIL: $student" | tee -a "$REPORT"
                result="FAIL"
              fi
            fi

            echo '```' >> "$REPORT"

            STUDENT="$student" RESULT="$result" \
              python - <<'PY' >> "$AUDIT"
          import json
          import os
          from datetime import datetime, timezone

          print(json.dumps({
              "student": os.environ["STUDENT"],
              "status": os.environ["RESULT"],
              "timestamp": datetime.now(timezone.utc).isoformat()
          }))
          PY

            if [[ "$result" != "PASS" ]]; then
              overall_status=1
            fi
          done

          cat "$REPORT"

          if [[ "$overall_status" -ne 0 ]]; then
            echo "One or more student test suites failed."
            exit 1
          fi

          echo "All five student test suites passed."


      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-test-evidence
          path: reports/
          if-no-files-found: warn

  deploy_azure:
    runs-on: ubuntu-latest
    needs: [post_commit_tests]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up deployment environment
        run: bash scripts/env-setup.sh
        env:
          REGISTER_PROVIDERS: "false"

      - name: Create ACR
        run: bash scripts/create-acr.sh        

      - name: Build and push images
        run: bash scripts/build-images.sh

      - name: Azure login (refresh)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Container Apps environment
        run: bash scripts/deploy-azure-env.sh

      - name: Azure login (refresh again)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: bash scripts/deploy-azure.sh

      - name: Configure Backend Env
        run: bash scripts/configure-backend-env.sh      

      - name: Configure Frontend Env
        run: bash scripts/configure-portal-env.sh


      - name: Validate deployment and generate evidence
        run: bash scripts/deployment-testing.sh

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-evidence
          path: reports/deployment-results.md
          if-no-files-found: warn