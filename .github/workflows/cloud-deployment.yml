name: cloud-deployment
 
on:
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  post_commit_tests:
    name: Run Post-Commit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
 
    defaults:
      run:
        shell: bash
        working-directory: 41026_ASD_Project
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Install test dependencies
        working-directory: .
        run: python -m pip install pytest requests "PyJWT>=2.11.0"
 
      - name: Start services
        run: docker compose up -d --build
 
      - name: Run post-commit tests
        run: |
          mkdir -p reports
 
          if python -m pytest tests/lab11/post_commit/ -v \
            > reports/test-results.md 2>&1; then
            status="PASS"
            exit_code=0
          else
            exit_code=$?
            status="FAIL"
          fi
 
          printf '{"status":"%s","timestamp":"%s"}\n' \
            "$status" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> reports/test-audit.jsonl
 
          cat reports/test-results.md
          exit "$exit_code"
 
      - name: Stop test services
        if: always()
        run: docker compose down -v
 
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deployment-test-evidence
          path: |
            41026_ASD_Project/reports/test-results.md
            41026_ASD_Project/reports/test-audit.jsonl
          if-no-files-found: warn
          retention-days: 30
 
  deploy_azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: post_commit_tests
    timeout-minutes: 60
 
    defaults:
      run:
        shell: bash
        working-directory: 41026_ASD_Project
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Set up cloud environment
        run: bash scripts/release2-deployment/env-setup.sh
 
      - name: Build and push images
        run: bash scripts/release2-deployment/build-images.sh
 
      - name: Create Container Apps environment
        run: bash scripts/release2-deployment/deploy-azure-env.sh
 
      - name: Deploy cloud services
        run: bash scripts/release2-deployment/deploy-azure.sh
 
      - name: Validate cloud deployment
        run: bash scripts/release2-deployment/deployment-testing.sh
 
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deployment-evidence
          path: 41026_ASD_Project/reports/release2-deployment/deployment-results.md
          if-no-files-found: warn
          retention-days: 30